name: Bug report
description: Something isn't working right
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please redact any
        API keys, hostnames, or other secrets before pasting output below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran and the input you gave.
      placeholder: |
        1. Run `termwhat "..."`
        2. ...
    validations:
      required: true

  - type: textarea
    id: doctor-output
    attributes:
      label: "`termwhat --doctor` output"
      description: >
        Run `termwhat --doctor` and paste the output here.
        Please redact any API keys, hostnames, or other secrets first.
      render: shell
    validations:
      required: true

  - type: input
    id: provider-model
    attributes:
      label: Provider + model
      description: e.g. "ollama / llama3.1" or "openai / gpt-4o-mini"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15, Ubuntu 24.04, Windows 11 (WSL2)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true

  - type: input
    id: termwhat-version
    attributes:
      label: termwhat version
      description: Output of `termwhat --version`
    validations:
      required: true
